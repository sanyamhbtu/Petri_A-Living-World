zerops:
  - setup: nodejs
    build:
      base: ubuntu/nodejs@22
      buildCommands:
        - corepack enable
        - pnpm install --frozen-lockfile
        - pnpm run build
      deployFiles:
        - node_modules
        - .next
        - app
        - components
        - lib
        - public
        - scripts
        - dist-server
        - server.ts
        - package.json
        - pnpm-lock.yaml
        - next.config.mjs
        - postcss.config.mjs
        - tsconfig.json
        - tsconfig.server.json
    run:
      base: ubuntu/nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        HOST: 0.0.0.0
        PORT: 3000
        DATABASE_URL: ${DATABASE_URL}
        KV_REST_API_URL: ${KV_REST_API_URL}
        KV_REST_API_TOKEN: ${KV_REST_API_TOKEN}
      healthCheck:
        http:
          path: /api/health
          port: 3000
      start: pnpm start:production
