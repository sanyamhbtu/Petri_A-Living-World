zerops:
  - setup: nodejs
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - pnpm install --frozen-lockfile
        - pnpm run build
      deployFiles:
        - node_modules
        - .next
        - app
        - components
        - lib
        - public
        - scripts
        - dist-server
        - package.json
        - pnpm-lock.yaml
        - next.config.mjs
        - postcss.config.mjs
        - tsconfig.json
        - tsconfig.server.json
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        HOST: 0.0.0.0
        PORT: 3000
      healthCheck:
        httpGet:
          path: /api/health
          port: 3000
      start: node dist-server/scripts/prepare-db.js && node dist-server/server.js