services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://petri:petri@postgres:5432/petri
      KV_REST_API_URL: ${KV_REST_API_URL:-}
      KV_REST_API_TOKEN: ${KV_REST_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petri
      POSTGRES_PASSWORD: petri
      POSTGRES_DB: petri
    ports:
      - "5432:5432"
    volumes:
      - petri-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petri -d petri"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  petri-postgres:
